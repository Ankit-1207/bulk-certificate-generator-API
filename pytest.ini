[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # Starlette's TestClient uses an httpx shortcut that newer httpx versions deprecate.
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
    # Newer Starlette suggests a different HTTP client for its TestClient; harmless here.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
